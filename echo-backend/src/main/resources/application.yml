server:
  port: ${SERVER_PORT:8088}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}
  servlet:
    context-path: ${CONTEXT_PATH:}

app:
  ai:
    # bot 用普通自增 id，按 username 解析（避免显式高 id 顶爆 AUTO_INCREMENT，InnoDB 不允许把计数器重置到低于 max(id)）
    bot-username: ${AI_BOT_USERNAME:ai_assistant}
    bot-nickname: ${AI_BOT_NICKNAME:AI 助手}
    persona: ${AI_PERSONA:你是 Echo Chat Room 的 AI 助手，请用简体中文友好地回答，语气自然、简洁。}
    # 多轮记忆上下文窗口：把用户与 bot 最近 N 条文字消息作为上下文（≈ N/2 轮对话）
    context-window-messages: ${AI_CONTEXT_WINDOW_MESSAGES:20}
    # 受控单 Agent：仅注册无副作用的只读工具；工具参数、权限范围与审计均由服务端处理。
    agent:
      enabled: ${AI_AGENT_ENABLED:true}
      max-steps: ${AI_AGENT_MAX_STEPS:3}
      max-tool-calls: ${AI_AGENT_MAX_TOOL_CALLS:4}
      planning-timeout-ms: ${AI_AGENT_PLANNING_TIMEOUT_MS:45000}
      # 站内提醒扫描。5 秒一轮，配合前端实时推送与 10 秒兜底轮询，
      # 到点通常在一个很短的窗口内显式弹出。
      reminder-sweep-interval-ms: ${AI_AGENT_REMINDER_SWEEP_INTERVAL_MS:5000}
      reminder-sweep-initial-delay-ms: ${AI_AGENT_REMINDER_SWEEP_INITIAL_DELAY_MS:5000}
      # 联网搜索仅使用服务端环境变量中的密钥，绝不下发给浏览器或模型。
      # Tavily Search API: https://api.tavily.com/search
      search:
        provider: ${AI_WEB_SEARCH_PROVIDER:tavily}
        api-key: ${AI_WEB_SEARCH_API_KEY:}
        max-results: ${AI_WEB_SEARCH_MAX_RESULTS:5}
      weather:
        # 和风天气的 API Host 与 API Key / Bearer Token 仅由部署环境持有，绝不返回浏览器。
        # 必填：从和风天气项目控制台复制专属 API Host（例如 https://xxxx.qweatherapi.com）。
        # 不使用已不适用于新项目的公共默认地址，以免把 403 误报成服务故障。
        api-host: ${QWEATHER_API_HOST:}
        # 免费订阅可直接使用 API Key；优先于 api-token。二者均未配置时天气工具会明确拒绝请求。
        api-key: ${QWEATHER_API_KEY:}
        api-token: ${QWEATHER_API_TOKEN:}
    # 知识库 RAG（本地中文嵌入 bge-small-zh-v1.5）
    kb:
      enabled: ${AI_KB_ENABLED:true}
      chunk-size: ${AI_KB_CHUNK_SIZE:500}
      chunk-overlap: ${AI_KB_CHUNK_OVERLAP:50}
      top-k: ${AI_KB_TOP_K:4}
      # BGE 余弦相似度低于该值时视为“无可靠知识依据”，避免无关问题被错误注入上下文。
      min-score: ${AI_KB_MIN_SCORE:0.55}
      max-chunks-per-document: ${AI_KB_MAX_CHUNKS_PER_DOCUMENT:2}
      semantic-fallback-score: ${AI_KB_SEMANTIC_FALLBACK_SCORE:0.68}
      max-doc-size: ${AI_KB_MAX_DOC_SIZE:1048576}
  presence:
    # Redis 在线状态 TTL（秒）：超过该时长无心跳视为离线
    online-ttl-seconds: ${APP_PRESENCE_ONLINE_TTL_SECONDS:150}
    # 服务端心跳超时淘汰阈值（秒）：会话超过该时长未收到心跳则关闭
    evict-idle-seconds: ${APP_PRESENCE_EVICT_IDLE_SECONDS:120}
    # 定时清扫间隔（毫秒）
    sweep-interval-ms: ${APP_PRESENCE_SWEEP_INTERVAL_MS:60000}
  file:
    # 大文件由 tusd 直接写入临时目录，Spring Boot 只保存元数据与完成确认。
    # Production uses a same-origin public path. This deliberately avoids a protocol-bearing
    # fallback, so an HTTPS page can never be instructed to upload to HTTP by a missing env var.
    tus-endpoint: ${TUSD_PUBLIC_ENDPOINT:/echo-files/}
    # The frontend tusd launcher writes under the project-root upload directory.
    # IDEA's Spring Boot run config has no explicit working directory, so it defaults
    # to the module root (project root). These relative paths resolve from there.
    tusd-upload-dir: ${TUSD_UPLOAD_DIR:upload/tusd}
    storage-dir: ${APP_FILE_STORAGE_DIR:upload/files}
    max-size: ${APP_FILE_MAX_SIZE:21474836480}
    intent-ttl-minutes: ${APP_FILE_INTENT_TTL_MINUTES:60}
    cleanup-interval-ms: ${APP_FILE_CLEANUP_INTERVAL_MS:3600000}
    cleanup-initial-delay-ms: ${APP_FILE_CLEANUP_INITIAL_DELAY_MS:300000}
  client-release:
    # 管理员上传的 Windows / Android 安装包，独立于聊天附件存储，只有已发布版本可被匿名下载。
    storage-dir: ${APP_CLIENT_RELEASE_STORAGE_DIR:upload/client-releases}
    max-size: ${APP_CLIENT_RELEASE_MAX_SIZE:1073741824}
  rtc:
    # 逗号分隔。生产建议同时提供 UDP、TCP 3478 和 TLS/TCP 5349。
    # 示例：turn:turn.example.com:3478?transport=udp,turn:turn.example.com:3478?transport=tcp
    turn-urls: ${RTC_TURN_URLS:}
    # 推荐 coturn --use-auth-secret + --static-auth-secret，后端会生成短期凭据。
    turn-shared-secret: ${RTC_TURN_SHARED_SECRET:}
    credential-ttl-seconds: ${RTC_TURN_CREDENTIAL_TTL_SECONDS:3600}
    # 兼容静态长期账号；配置 shared-secret 时下面两项会被忽略。
    turn-username: ${RTC_TURN_USERNAME:}
    turn-credential: ${RTC_TURN_CREDENTIAL:}
    ice-transport-policy: ${RTC_ICE_TRANSPORT_POLICY:all}

# AI Gateway（DeepSeek，OpenAI 兼容接口）。流式模型 bean 仅在 api-key 非空时由 starter 自动配置；
# AiChatServiceImpl 也会以解析后的 key 为准做兜底，无 key 时优雅降级。
langchain4j:
  open-ai:
    streaming-chat-model:
      base-url: ${AI_BASE_URL:https://api.deepseek.com/v1}
      api-key: ${AI_API_KEY:}
      model-name: ${AI_MODEL:deepseek-chat}
      temperature: 0.7
      timeout: 60s

spring:
  application:
    name: echo-chat
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/echo_chat?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接池配置：
    druid:
      initial-size: 2 # 初始化时建立物理连接的个数。默认0
      max-active: 10 # 最大连接池数量，默认8
      min-idle: 1 # 最小连接池数量
      max-wait: 2000 # 获取连接时最大等待时间，单位毫秒。
      pool-prepared-statements: false # 是否缓存preparedStatement，也就是PSCache。PSCache对支持游标的数据库性能提升巨大，比如说oracle。在mysql下建议关闭。
      max-pool-prepared-statement-per-connection-size: -1 # 要启用PSCache，必须配置大于0，当大于0时，poolPreparedStatements自动触发修改为true。在Druid中，不会存在Oracle下PSCache占用内存过多的问题，可以把这个数值配置大一些，比如说100

      # 启用Druid内置的Filter，会使用默认的配置。可自定义配置，见下方的各个filter节点。
      filters: stat,wall
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      # 管理员发布安装包会经过 Spring；聊天大文件仍由 tusd 断点续传。
      max-file-size: ${APP_MULTIPART_MAX_FILE_SIZE:1024MB}
      max-request-size: ${APP_MULTIPART_MAX_REQUEST_SIZE:1024MB}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: existing echo_chat schema
    validate-on-migrate: true
    clean-disabled: true
  
  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000

  # 邮件配置
  mail:
    host: smtp.qq.com
    port: 465
    protocol: smtp
    default-encoding: UTF-8
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

# JWT配置
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24小时

# WebSocket配置
websocket:
  endpoint: /ws

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.echo.pojo
  configuration:
    map-underscore-to-camel-case: true
